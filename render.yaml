services:
  - type: web
    name: vehicle-counter-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && mkdir -p backend/demo_videos && curl -L -o backend/demo_videos/car-detection.mp4 https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/car-detection.mp4"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RTSP_URL
        value: demo_videos/car-detection.mp4
      - key: PROCESS_WIDTH
        value: "640"
      - key: DETECT_EVERY_N_FRAMES
        value: "2"
      - key: OUTPUT_FPS
        value: "15"
      - key: JPEG_QUALITY
        value: "70"
      - key: LINE_X1
        value: "0.05"
      - key: LINE_Y1
        value: "0.55"
      - key: LINE_X2
        value: "0.95"
      - key: LINE_Y2
        value: "0.55"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
