services:
  - type: web
    name: vehicle-counter-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && mkdir -p backend/demo_videos && curl -L -o backend/demo_videos/car-detection.mp4 https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/car-detection.mp4"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RTSP_URL
        value: demo_videos/car-detection.mp4
      # No .onnx model file shipped to this free-tier demo deploy, so pin
      # to the no-model-file fallback explicitly (main.py would auto-fall
      # back anyway, but this avoids a "couldn't load model" warning in
      # the logs on every boot). Run export_yolo_onnx.py + upload the
      # model to get labeled boxes on your own deployment.
      - key: DETECTOR_BACKEND
        value: bgsub
      - key: PROCESS_WIDTH
        value: "640"
      - key: DETECT_EVERY_N_FRAMES
        value: "2"
      - key: OUTPUT_FPS
        value: "15"
      - key: JPEG_QUALITY
        value: "70"
      - key: LINE_X1
        value: "0.05"
      - key: LINE_Y1
        value: "0.55"
      - key: LINE_X2
        value: "0.95"
      - key: LINE_Y2
        value: "0.55"
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      # Optional Postgres persistence (see backend/app/db.py). Left unset
      # here (sync: false = "set this manually in the Render dashboard,
      # don't store the value in this file") since it's a credential and
      # this demo deploy doesn't need it to keep working. If you do want
      # crossing events persisted, set this to a Neon connection string —
      # Render's own free Postgres tier expires after 30 days, which would
      # silently drop this data; Neon's free tier doesn't expire.
      - key: DATABASE_URL
        sync: false
