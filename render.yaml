services:
  - type: web
    name: vehicle-counter-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && mkdir -p backend/demo_videos && curl -L -o backend/demo_videos/sideview.mp4 https://raw.githubusercontent.com/Lab-Work/ITS2017_Validation/master/sample.mp4"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RTSP_URL
        value: demo_videos/sideview.mp4
      - key: PROCESS_WIDTH
        value: "640"
      - key: DETECT_EVERY_N_FRAMES
        value: "2"
      - key: OUTPUT_FPS
        value: "15"
      - key: JPEG_QUALITY
        value: "70"
      - key: DETECTOR_BACKEND
        value: "yolo"
      - key: YOLO_MODEL_PATH
        value: "models/yolov8n.onnx"
      - key: YOLO_INPUT_SIZE
        value: "320"
      - key: YOLO_CONF_THRESHOLD
        value: "0.4"
      - key: YOLO_NMS_THRESHOLD
        value: "0.45"
      - key: LINE_X1
        value: "0.5"
      - key: LINE_Y1
        value: "0.55"
      - key: LINE_X2
        value: "0.5"
      - key: LINE_Y2
        value: "0.9"
      - key: EVENT_LOG_SIZE
        value: "200"
      - key: CORS_ORIGINS
        value: "https://tripwire-inky.vercel.app"
