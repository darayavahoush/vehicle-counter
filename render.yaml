services:
  - type: web
    name: vehicle-counter-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && pip install -q huggingface_hub && python -c \"from huggingface_hub import hf_hub_download; clips=['DJI_0025.MP4','DJI_0011.MP4','DJI_0030.MP4']; [hf_hub_download(repo_id='anabaena/drone-vehicle-clips', repo_type='dataset', filename=f, local_dir='backend/demo_videos/drone') for f in clips]\""
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RTSP_URL
        value: demo_videos/drone   # directory -> cycles through every clip inside
      - key: COUNT_MODE
        value: static_occupancy    # no tripwire, just live snapshot counts
      - key: STATIC_DETECT_INTERVAL_SEC
        value: "5"                 # tiled inference is expensive; re-run every 5s, not every frame
      - key: TILE_SIZE
        value: "320"
      - key: TILE_OVERLAP
        value: "100"               # was: 80 -> tested against real footage, +10% recall, no new false positives
      - key: PROCESS_WIDTH
        value: "1280"
      - key: DETECT_EVERY_N_FRAMES
        value: "2"                 # unused in static_occupancy mode, harmless to leave
      - key: OUTPUT_FPS
        value: "15"
      - key: JPEG_QUALITY
        value: "70"
      - key: DETECTOR_BACKEND
        value: "yolo"
      - key: YOLO_MODEL_PATH
        value: "models/yolov8n.onnx"
      - key: YOLO_INPUT_SIZE
        value: "320"
      - key: YOLO_CONF_THRESHOLD
        value: "0.24"              # was: 0.25 -> tested down to here without reintroducing false positives (0.20-0.22 boxed a distant building as a truck)
      - key: YOLO_NMS_THRESHOLD
        value: "0.45"
      - key: EVENT_LOG_SIZE
        value: "200"
      - key: CORS_ORIGINS
        value: "https://tripwire-inky.vercel.app"
